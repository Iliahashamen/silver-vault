<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" role="img" aria-label="GROUPTECH">
  <defs>
    <linearGradient id="gtGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D878"/>
      <stop offset="45%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="gtGoldSoft" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A07C12" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E2BF50"/>
    </linearGradient>
    <filter id="gtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#C9A227" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Octagon frame -->
  <polygon
    points="65,6 108,22 124,65 108,108 65,124 22,108 6,65 22,22"
    fill="none"
    stroke="url(#gtGold)"
    stroke-width="3.8"
    stroke-linejoin="round"
    filter="url(#gtGlow)"
  />

  <!-- GT -->
  <text x="65" y="46" text-anchor="middle" fill="url(#gtGold)" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-1">GT</text>

  <!-- Candlestick chart -->
  <g fill="url(#gtGoldSoft)" stroke="url(#gtGold)" stroke-width="1.1">
    <line x1="28" y1="88" x2="28" y2="78"/><rect x="25" y="78" width="6" height="5" rx="0.5"/>
    <line x1="38" y1="90" x2="38" y2="74"/><rect x="35" y="70" width="6" height="8" rx="0.5"/>
    <line x1="48" y1="92" x2="48" y2="68"/><rect x="45" y="62" width="6" height="10" rx="0.5"/>
    <line x1="58" y1="88" x2="58" y2="72"/><rect x="55" y="68" width="6" height="7" rx="0.5"/>
    <line x1="68" y1="86" x2="68" y2="64"/><rect x="65" y="58" width="6" height="11" rx="0.5"/>
    <line x1="78" y1="84" x2="78" y2="60"/><rect x="75" y="52" width="6" height="13" rx="0.5"/>
    <line x1="88" y1="82" x2="88" y2="56"/><rect x="85" y="48" width="6" height="14" rx="0.5"/>
    <line x1="98" y1="80" x2="98" y2="52"/><rect x="95" y="44" width="6" height="16" rx="0.5"/>
  </g>
</svg>
